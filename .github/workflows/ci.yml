name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop and platform (.NET)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build desktop solution
        run: dotnet build SmartCafeteria.sln --configuration Release --nologo -m:1

      - name: Test desktop non-UI projects
        run: dotnet test SmartCafeteria.sln --configuration Release --no-build --nologo --settings SmartCafeteria.runsettings -m:1 --filter "FullyQualifiedName!~SmartCafeteria.UI.Tests"

      - name: Build platform solution
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform
        run: dotnet build CafeteriaRemotePlatform.sln --configuration Release --nologo -m:1

      - name: Test platform solution
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform
        run: dotnet test CafeteriaRemotePlatform.sln --configuration Release --no-build --nologo -m:1

  mobile:
    name: Mobile (Expo)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Expo doctor
        run: npm run doctor

      - name: Export Android bundle
        run: npx expo export --platform android

  integration:
    name: Integration (PostgreSQL live API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform
    env:
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=cafeteria_ci;Username=postgres;Password=postgres"
      Jwt__UserSigningKey: "ci-user-signing-key-0123456789-abcdefghijklmnop"
      Jwt__InstallationSigningKey: "ci-installation-signing-key-0123456789-qrstuvwxyz"
      Database__AutoMigrate: "true"
      ASPNETCORE_URLS: "http://localhost:5080"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cafeteria_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafeteria_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build API
        run: dotnet build Cloud/Cafeteria.Api/Cafeteria.Api.csproj --configuration Release --nologo

      - name: Start API
        run: |
          dotnet run --project Cloud/Cafeteria.Api/Cafeteria.Api.csproj --configuration Release --no-build > "$RUNNER_TEMP/cafeteria-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cafeteria-api.pid"

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5080/health > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5080/health | jq -e '.status == "ok"'

      - name: Live command lifecycle smoke
        run: |
          base=http://localhost:5080
          stamp=$(date +%s)
          email="smoke+$stamp@example.test"
          password="Sm0ke!$stamp"
          register=$(jq -n --arg company "Smoke $stamp" --arg email "$email" --arg password "$password" '{companyName: $company, ownerEmail: $email, ownerDisplayName: "Smoke Owner", password: $password}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$register" "$base/api/auth/register" > /dev/null
          login=$(jq -n --arg email "$email" --arg password "$password" '{email: $email, password: $password}')
          auth=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$login" "$base/api/auth/login")
          tenant=$(echo "$auth" | jq -r '.user.tenants[0].id')
          userToken=$(echo "$auth" | jq -r '.tokens.accessToken')
          claim=$(curl -fsS -X POST -H "Authorization: Bearer $userToken" "$base/api/tenants/$tenant/installations/claim-codes")
          code=$(echo "$claim" | jq -r '.code')
          claimRequest=$(jq -n --arg code "$code" '{code: $code, name: "Smoke Desktop", machineName: "SMOKE-PC", appVersion: "1.0.0"}')
          claimed=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$claimRequest" "$base/api/installations/claim")
          installationId=$(echo "$claimed" | jq -r '.installationId')
          installationSecret=$(echo "$claimed" | jq -r '.installationSecret')
          tokenRequest=$(jq -n --arg installationId "$installationId" --arg installationSecret "$installationSecret" '{installationId: $installationId, installationSecret: $installationSecret}')
          token=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$tokenRequest" "$base/api/installations/token")
          installationToken=$(echo "$token" | jq -r '.accessToken')
          installationAuth="Authorization: Bearer $installationToken"
          heartbeat=$(jq -n '{appVersion: "1.0.0"}')
          curl -fsS -X POST -H "$installationAuth" -H 'Content-Type: application/json' -d "$heartbeat" "$base/api/installations/heartbeat" > /dev/null
          commandRequest=$(jq -n --arg installationId "$installationId" --arg idempotencyKey "smoke-$stamp" '{installationId: $installationId, type: "dashboard.snapshot", payloadJson: "{}", idempotencyKey: $idempotencyKey}')
          created=$(curl -fsS -X POST -H "Authorization: Bearer $userToken" -H 'Content-Type: application/json' -d "$commandRequest" "$base/api/tenants/$tenant/commands")
          commandId=$(echo "$created" | jq -r '.id')
          pending=$(curl -fsS -H "$installationAuth" "$base/api/installations/commands/pending")
          echo "$pending" | jq -e --arg commandId "$commandId" 'any(.[]; .id == $commandId)' > /dev/null
          curl -fsS -X POST -H "$installationAuth" "$base/api/installations/commands/$commandId/ack" > /dev/null
          complete=$(jq -n '{success: true, resultJson: "{\"ok\":true}", error: null}')
          curl -fsS -X POST -H "$installationAuth" -H 'Content-Type: application/json' -d "$complete" "$base/api/installations/commands/$commandId/complete" > /dev/null
          final=$(curl -fsS -H "Authorization: Bearer $userToken" "$base/api/tenants/$tenant/commands/$commandId")
          echo "$final" | jq -e '.status == "Completed"' > /dev/null
          echo "LIVE_SMOKE_OK command=$commandId status=$(echo "$final" | jq -r '.status')"

      - name: Dump API log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/cafeteria-api.log" || true

      - name: Stop API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cafeteria-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cafeteria-api.pid")" 2>/dev/null || true
          fi

  maestro:
    name: Maestro (Android E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=cafeteria_maestro;Username=postgres;Password=postgres"
      Jwt__UserSigningKey: "e2e-user-signing-key-0123456789-abcdefghijklmnop"
      Jwt__InstallationSigningKey: "e2e-installation-signing-key-0123456789-qrstuvwxyz"
      Database__AutoMigrate: "true"
      ASPNETCORE_URLS: "http://0.0.0.0:5080"
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_CLI_NO_ANALYTICS: "true"
      MAESTRO_DISABLE_UPDATE_CHECK: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cafeteria_maestro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafeteria_maestro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager/package-lock.json

      - name: Install mobile dependencies
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager
        run: npm ci

      - name: Expo prebuild Android
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager
        run: npx expo prebuild --platform android --clean

      - name: Enable JS bundle in Android debug build
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager/android/app
        run: |
          sed -i 's|// debuggableVariants = \["liteDebug", "prodDebug"\]|debuggableVariants = []|' build.gradle
          grep -F 'debuggableVariants = []' build.gradle

      - name: Build debug APK
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=x86_64

      - name: Verify debug APK contains JS bundle
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager/android
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.android.bundle'

      - name: Build and start API
        working-directory: Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform
        run: |
          dotnet build Cloud/Cafeteria.Api/Cafeteria.Api.csproj --configuration Release --nologo
          dotnet run --project Cloud/Cafeteria.Api/Cafeteria.Api.csproj --configuration Release --no-build > "$RUNNER_TEMP/cafeteria-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cafeteria-api.pid"
          healthy=false
          for i in {1..60}; do
            if curl -fsS http://localhost:5080/health > /dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "API did not start"
            tail -n 100 "$RUNNER_TEMP/cafeteria-api.log" || true
            exit 1
          fi
          curl -fsS http://localhost:5080/health | jq -e '.status == "ok"'

      - name: Seed E2E account installation and command
        run: |
          base=http://localhost:5080
          stamp=$(date +%s)
          email="maestro+$stamp@example.test"
          password="Mae5tro!$stamp"
          register=$(jq -n --arg company "Maestro $stamp" --arg email "$email" --arg password "$password" '{companyName: $company, ownerEmail: $email, ownerDisplayName: "Maestro Owner", password: $password}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$register" "$base/api/auth/register" > /dev/null
          login=$(jq -n --arg email "$email" --arg password "$password" '{email: $email, password: $password}')
          auth=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$login" "$base/api/auth/login")
          tenant=$(echo "$auth" | jq -er '.user.tenants[0].id')
          userToken=$(echo "$auth" | jq -er '.tokens.accessToken')
          claim=$(curl -fsS -X POST -H "Authorization: Bearer $userToken" "$base/api/tenants/$tenant/installations/claim-codes")
          code=$(echo "$claim" | jq -er '.code')
          claimRequest=$(jq -n --arg code "$code" '{code: $code, name: "Maestro Desktop", machineName: "MAESTRO-PC", appVersion: "1.0.0"}')
          claimed=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$claimRequest" "$base/api/installations/claim")
          installationId=$(echo "$claimed" | jq -er '.installationId')
          installationSecret=$(echo "$claimed" | jq -er '.installationSecret')
          tokenRequest=$(jq -n --arg installationId "$installationId" --arg installationSecret "$installationSecret" '{installationId: $installationId, installationSecret: $installationSecret}')
          token=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$tokenRequest" "$base/api/installations/token")
          installationToken=$(echo "$token" | jq -er '.accessToken')
          curl -fsS -X POST -H "Authorization: Bearer $installationToken" -H 'Content-Type: application/json' -d '{"appVersion":"1.0.0"}' "$base/api/installations/heartbeat" > /dev/null
          commandRequest=$(jq -n --arg installationId "$installationId" --arg idempotencyKey "maestro-$stamp" '{installationId: $installationId, type: "dashboard.snapshot", payloadJson: "{}", idempotencyKey: $idempotencyKey}')
          curl -fsS -X POST -H "Authorization: Bearer $userToken" -H 'Content-Type: application/json' -d "$commandRequest" "$base/api/tenants/$tenant/commands" > /dev/null
          {
            echo "E2E_EMAIL=$email"
            echo "E2E_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Install Maestro CLI
        run: |
          export MAESTRO_VERSION=2.4.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p "$GITHUB_WORKSPACE/maestro-results"
            adb install -r "$GITHUB_WORKSPACE/Mobile Application Cloud-Based Remote Management/CafeteriaRemotePlatform/Mobile/CafeteriaManager/android/app/build/outputs/apk/debug/app-debug.apk"
            dismiss_system_dialogs() {
              adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1 || true
              for _ in 1 2 3 4 5; do
                adb shell uiautomator dump /sdcard/uidump.xml >/dev/null 2>&1 || true
                adb pull /sdcard/uidump.xml "$GITHUB_WORKSPACE/maestro-results/uidump-check.xml" >/dev/null 2>&1 || true
                if [ -f "$GITHUB_WORKSPACE/maestro-results/uidump-check.xml" ] && grep -q "isn't responding" "$GITHUB_WORKSPACE/maestro-results/uidump-check.xml"; then
                  cat > "$RUNNER_TEMP/dismiss_anr.py" <<'PY'
            import os, re, subprocess, xml.etree.ElementTree as ET
            path = os.path.join(os.environ["GITHUB_WORKSPACE"], "maestro-results", "uidump-check.xml")
            try:
                root = ET.parse(path).getroot()
            except Exception:
                raise SystemExit(0)
            for label in ("Wait", "Close app"):
                for node in root.iter("node"):
                    if node.attrib.get("text") == label:
                        m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                        if m:
                            x1, y1, x2, y2 = map(int, m.groups())
                            subprocess.run(["adb", "shell", "input", "tap", str((x1 + x2) // 2), str((y1 + y2) // 2)], check=False)
                            raise SystemExit(0)
            PY
                  python3 "$RUNNER_TEMP/dismiss_anr.py" || true
                  sleep 2
                else
                  break
                fi
              done
            }
            dismiss_system_dialogs
            status=0
            maestro test --format junit --output "$GITHUB_WORKSPACE/maestro-results/report.xml" --env E2E_EMAIL="$E2E_EMAIL" --env E2E_PASSWORD="$E2E_PASSWORD" "$GITHUB_WORKSPACE/.maestro/flows" || status=$?
            adb shell uiautomator dump /sdcard/window.xml > "$GITHUB_WORKSPACE/maestro-results/uiautomator.txt" 2>&1 || true
            adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/maestro-results/window.xml" || true
            adb shell dumpsys window > "$GITHUB_WORKSPACE/maestro-results/window-dumpsys.txt" 2>&1 || true
            adb logcat -d > "$GITHUB_WORKSPACE/maestro-results/logcat.txt" 2>&1 || true
            exit "$status"

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: maestro-results/
          if-no-files-found: error

      - name: Dump API log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/cafeteria-api.log" || true

      - name: Stop API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cafeteria-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cafeteria-api.pid")" 2>/dev/null || true
          fi
